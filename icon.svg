<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#5b6cf0"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (iOS rounds the corners itself) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- soft top-right glow -->
  <circle cx="400" cy="110" r="230" fill="#ffffff" opacity="0.10"/>

  <!-- equalizer bars motif -->
  <g>
    <rect x="150" y="150" width="34" height="120" rx="17" fill="url(#bar)"/>
    <rect x="200" y="110" width="34" height="200" rx="17" fill="url(#bar)"/>
    <rect x="250" y="86"  width="34" height="248" rx="17" fill="url(#bar)"/>
    <rect x="300" y="130" width="34" height="160" rx="17" fill="url(#bar)"/>
    <rect x="350" y="170" width="34" height="92"  rx="17" fill="url(#bar)"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="408" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="132" font-weight="800" fill="#ffffff" letter-spacing="2">MB</text>
  <text x="256" y="468" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="600" fill="#ffffff" fill-opacity="0.95" letter-spacing="14">HI-FI</text>
</svg>
